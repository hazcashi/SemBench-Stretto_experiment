name: Publish source update with validated dependencies
on:
  workflow_dispatch:
    inputs:
      base_image:
        description: Immutable baseline image from the successful full build
        required: true
        type: string
      base_revision:
        description: Full source revision recorded in that image
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Space on the disposable hosted runner
        run: sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify base and unchanged environment inputs
        env:
          BASE_IMAGE: ${{ inputs.base_image }}
          BASE_REVISION: ${{ inputs.base_revision }}
        shell: bash
        run: |
          [[ "$BASE_IMAGE" =~ ^ghcr\.io/hazcashi/sembench-stretto_experiment@sha256:[0-9a-f]{64}$ ]]
          [[ "$BASE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          docker pull "$BASE_IMAGE"
          actual=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$BASE_IMAGE")
          [[ "$actual" == "$BASE_REVISION" ]]
          git diff --exit-code "$BASE_REVISION" HEAD -- Dockerfile .dockerignore docker/requirements.in docker/requirements.lock stretto-main/stretto-main/pyproject.toml stretto-main/stretto-main/kvpress
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: docker/Dockerfile.source-update
          platforms: linux/amd64
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          build-args: |
            BASE_IMAGE=${{ inputs.base_image }}
            SOURCE_REVISION=${{ github.sha }}
      - name: Export and verify immutable image reference
        run: |
          echo '${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}' > image.txt
          docker buildx imagetools inspect "$(cat image.txt)"
      - uses: actions/upload-artifact@v4
        with:
          name: immutable-image-reference
          path: image.txt
