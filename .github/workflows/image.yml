name: Build and publish baseline image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Space for CUDA build on the disposable hosted runner
        run: sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          build-args: SOURCE_REVISION=${{ github.sha }}
      - name: Export immutable image reference
        run: echo '${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}' > image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: immutable-image-reference
          path: image.txt
